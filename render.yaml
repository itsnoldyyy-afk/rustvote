services:
  - type: web
    name: rustvote
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: sqlite:///tmp/rustvote.db
      - key: HOST
        value: 0.0.0.0
