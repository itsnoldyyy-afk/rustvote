<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | RustVote</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <header class="site-header"><a class="brand" href="/">Rust<span class="brand-mark">Vote</span></a></header>
    <main class="page-narrow">
        <section class="panel">
        <h1>RustVote Admin</h1>
        <p class="notice">{{ error }}</p>
        <form method="post" action="/admin/login" data-loading>
            <label for="username">Username</label>
            <input id="username" name="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Log in</button>
        </form>
        </section>
    </main>
    <footer>RustVote administration</footer>
</body>
</html>
